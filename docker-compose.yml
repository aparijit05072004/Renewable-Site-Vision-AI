# TerraGuard-v2 — PostgreSQL 16 + PostGIS 3.4, FastAPI engine, React UI
version: "3.9"

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: terraguard
      POSTGRES_USER: terraguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./terraguard/layer3_spatial/postgis_clipping.sql:/docker-entrypoint-initdb.d/postgis_clipping.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraguard"]
      interval: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TERRAGUARD_PG_DSN: postgresql://terraguard:${POSTGRES_PASSWORD}@postgis:5432/terraguard
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
    command: uvicorn terraguard.layer4_orchestrator.api_server:app --host 0.0.0.0 --port 8000

volumes:
  pg_data:
